[project]
name = "billing-sample"
version = "0.1.0"
description = "Sample subscription-billing project used by the MiniMax SDD context demo."
requires-python = ">=3.12,<4"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/billing"]

[tool.pytest.ini_options]
testpaths = ["tests"]
